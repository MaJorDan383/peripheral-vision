name: tests

# The plugin's suite is hermetic: no desktop session, no camera, no model, no Hermes install.
# Anything that would need those is either monkeypatched or documented as not covered, so this
# workflow is the same run as `python -m pytest tests/ -q` on a developer machine.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # `ubuntu-latest` moved to Ubuntu 26 in October 2026, which carries no Python 3.9 runtime:
    # the floor is now 3.10, the oldest version GitHub still builds that image for (3.11 and
    # 3.13 remain in the matrix alongside it). Keeping the tests on 3.10 rather than 3.9 is why
    # this workflow tracks `ubuntu-latest` instead of pinning an image.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install --disable-pip-version-check pytest fastapi Pillow
      - name: Run the test suite
        run: python -m pytest tests/ -q
