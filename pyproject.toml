[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peripheral-vision"
version = "1.5.0"
description = "Peripheral vision for Hermes: watch a display, window, or camera - changed frames are described and injected into the turn"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "MaJorDan"}
]
keywords = ["hermes", "hermes-plugin", "vision", "screen-capture", "camera", "ambient-context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
# Upper bounds follow the plugin dependency policy: the oldest API-compatible floor plus a
# major-version cap, so Hermes' dependency resolver stays predictable when these libraries
# release a new major.
dependencies = [
    "opencv-python-headless>=4.5,<6",
    "Pillow>=10.0,<13",
    "openai>=1.0.0,<3",
    # Window and display capture on macOS is CoreGraphics. The platform marker keeps it off
    # every other install (pyobjc cannot build off macOS) and Hermes' resolver hands it to uv,
    # which evaluates the marker for the target interpreter. A host that ends up without it is
    # still served: the `screencapture` tier captures displays and cameras, and /sources says
    # why the window list is empty.
    "pyobjc-framework-Quartz>=9.0,<12; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/MaJorDan383/peripheral-vision"
Repository = "https://github.com/MaJorDan383/peripheral-vision"
Issues = "https://github.com/MaJorDan383/peripheral-vision/issues"
Changelog = "https://github.com/MaJorDan383/peripheral-vision/blob/main/CHANGELOG.md"

# This is a Hermes plugin: it is distributed and loaded as a DIRECTORY (plugin.yaml +
# __init__.py + dashboard/ + desktop/), not as an importable Python package — the directory
# name contains a hyphen, so it can never be imported by name. Declaring no packages keeps
# setuptools out of flat-layout auto-discovery (which otherwise tries to ship dashboard/ as a
# top-level package and fails); Hermes installs the `dependencies` above for its environment.
[tool.setuptools]
packages = []

# Lint gate: correctness rules only. The extended pycodestyle/pylint families are
# deliberately NOT enabled — this plugin is a resilience-first capture layer where broad
# `except` blocks and best-effort fallbacks are the design (see SECURITY.md), and churn for
# style alone is not worth the review noise. `ruff format` is likewise not enforced.
[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["F", "E9", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["capture", "capture_linux", "capture_macos", "capture_windows", "shared_state", "plugin_api"]
