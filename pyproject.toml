[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peripheral-vision"
version = "1.3.0"
description = "Peripheral Vision plugin for Hermes - monitors screens, windows, cameras, and routes frames to vision models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "MaJorDan"}
]
keywords = ["vision", "camera", "monitor", "screen", "hermes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Operating System :: Microsoft :: Windows",
]
# Upper bounds follow the plugin dependency policy: the oldest API-compatible floor plus a
# major-version cap, so Hermes' dependency resolver stays predictable when these libraries
# release a new major.
dependencies = [
    "opencv-python-headless>=4.5,<6",
    "Pillow>=10.0,<13",
    "openai>=1.0.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
linux = [
    "pipewire-capture>=0.1,<1",
]

[project.urls]
Homepage = "https://github.com/MaJorDan383/peripheral-vision"
Repository = "https://github.com/MaJorDan383/peripheral-vision"
Issues = "https://github.com/MaJorDan383/peripheral-vision/issues"

# This is a Hermes plugin: it is distributed and loaded as a DIRECTORY (plugin.yaml +
# __init__.py + dashboard/ + desktop/), not as an importable Python package — the directory
# name contains a hyphen, so it can never be imported by name. Declaring no packages keeps
# setuptools out of flat-layout auto-discovery (which otherwise tries to ship dashboard/ as a
# top-level package and fails); Hermes installs the `dependencies` above for its environment.
[tool.setuptools]
packages = []
